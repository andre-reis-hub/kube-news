apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: kube-news
  labels:
    app: postgres
type: Opaque
# Values are base64-encoded:
#   kubedevnews -> a3ViZWRldm5ld3M=
#   Pg#123      -> UGcjMTIz
data:
  POSTGRES_DB: a3ViZWRldm5ld3M=
  POSTGRES_USER: a3ViZWRldm5ld3M=
  POSTGRES_PASSWORD: UGcjMTIz
