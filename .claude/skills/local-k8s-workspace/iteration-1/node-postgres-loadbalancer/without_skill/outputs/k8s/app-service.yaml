apiVersion: v1
kind: Service
metadata:
  name: kube-news
  namespace: kube-news
  labels:
    app: kube-news
  annotations:
    # MetalLB will assign an IP from its configured pool
    metallb.universe.tf/address-pool: default
spec:
  selector:
    app: kube-news
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer
