name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE: registry.digitalocean.com/meu-registry/app

jobs:
  build-and-deploy:
    name: Build, Push e Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar doctl
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.101.0/doctl-1.101.0-linux-amd64.tar.gz | tar xz
          sudo mv doctl /usr/local/bin

      - name: Login no registry
        run: doctl registry login --expiry-seconds 600

      - name: Build da imagem
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Push da imagem
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy
        run: |
          doctl kubernetes cluster kubeconfig save meu-cluster
          kubectl set image deployment/app app=$IMAGE:${{ github.sha }}
          kubectl rollout status deployment/app --timeout=120s
